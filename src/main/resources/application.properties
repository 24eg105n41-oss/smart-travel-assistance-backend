# ===================================================================
# Server Configuration (Render injects PORT, default to 8080 locally)
# ===================================================================
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=smart-travel-assistance

# ===================================================================
# Database Configuration (MySQL / Aiven Cloud)
# Supports individual environment variables:
#   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD, DB_SSL_MODE
# Also supports a direct JDBC connection string via:
#   SPRING_DATASOURCE_URL or DB_URL
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_travel}?sslMode=${DB_SSL_MODE:REQUIRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DB_USER:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (sized for cloud instance limits)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ===================================================================
# JPA / Hibernate Configuration
# 'update' automatically updates table schema without dropping existing data
# ===================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# SQL Initialization & Seeding
# Kept 'never' by default so data.sql is not re-executed on every restart.
# Initial data seeding is handled idempotently by DatabaseSeeder.java.
# ===================================================================
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=true

# ===================================================================
# CORS Configuration
# Allowed frontend origins: includes production Vercel frontend and local development
# Override or extend via FRONTEND_URL or ALLOWED_ORIGINS environment variables
# ===================================================================
cors.allowed-origins=${FRONTEND_URL:${ALLOWED_ORIGINS:https://smart-travel-assistance-frontend.vercel.app,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}}
