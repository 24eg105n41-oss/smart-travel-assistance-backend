# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=smart-travel-assistance

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smart_travel?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Seed data - runs only if tables are empty
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


