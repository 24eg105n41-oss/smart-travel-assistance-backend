# Test environment datasource configuration
# Uses an in-memory H2 database in MySQL compatibility mode to decouple build and test from external databases
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Avoid running data.sql against H2 during test builds
spring.sql.init.mode=never
